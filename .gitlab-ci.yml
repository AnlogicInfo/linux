# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

stages:          # List of stages for jobs, and their order of execution
  - checkpatch
  - build
  - codecheck

checkpatch_ci:
  stage: checkpatch
  tags:
    - checkpatch
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - |
      errors=1;
      scripts/checkpatch.pl --git $CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD || let errors++
      for i in $(git diff --name-only $CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD | grep -ie ".*\.dtsi\?\|.*\.[hc]"); do scripts/checkpatch.pl -f $i || let errors++; done;
      [ $errors -eq 1 ]
  allow_failure: true

build_ci:
  stage: build
  tags:
    - checkpatch
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  artifacts:
    paths:
      - build_aarch64/
    expire_in: 1 hour
  script:
    - |
      export PATH=${toolchain_path}:$PATH
      builddir=build_aarch64
      mkdir -p ${builddir}
      mkcmd="make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- O=`pwd`/${builddir}"
      ${mkcmd} anlogic_dr1m90_defconfig
      ${mkcmd} dtbs
      ${mkcmd} -j8 Image

codecheck_ci:
  stage: codecheck
  tags:
    - checkpatch
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - |
      export PATH=${toolchain_path}:$PATH
      builddir=build_aarch64
      chkargs=
      for i in ${ct_extra_args}; do chkargs+=" --extra-arg=$i"; done
      mkcmd="make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- O=`pwd`/${builddir}"
      ${mkcmd} anlogic_dr1m90_defconfig
      ${mkcmd} -j8 clang-tidy
      for i in $(git diff --name-only $CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD | grep -ie ".*\.c"); do clang-tidy -p ${builddir}/ --quiet ${chkargs} --checks=linuxkernel-*,clang-analyzer-*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling $i || echo $i check1 fail; ${mkcmd} C=2 CHECK=`pwd`/scripts/coccicheck ${i/%\.c/\.o} |& grep "${i}:" || echo $i check2 fail; done;
